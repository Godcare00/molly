[project]
name = "molly-tunnel-protocol"
version = "0.1.0"
description = "Wire protocol and relay-token helpers shared by the Molly worker and gateway"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "pyjwt>=2"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
